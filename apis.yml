aid: aerospacekate
name: Aerospace Kate
description: >-
  Aerospace Kate (航天凯特) is the trading name of Chengdu Aerospace Kate Mechanical & Electrical
  Technology Co., Ltd. (成都航天凯特机电科技有限公司), a Chinese high-precision servo drive
  manufacturer founded in 2017 in Pidu District, Chengdu, Sichuan. A national high-tech and
  state-designated "little giant" specialized-and-innovative enterprise with roughly 200 staff
  (over half in R&D) and 210+ registered IP rights, it builds fully domestically-sourced servo
  drivers spanning 15V to 800V (KTSD, 蜀芯, 蓉驭 and 锦驱 series), KTMT hollow-cup motors,
  underwater thrusters and electric actuators, phased-array antenna steering gear, and the 灵捷
  (Lingjie) line of robot joint modules, collaborative arms, quadruped robots and humanoid
  platforms. A second line covers optoelectronic detection — panoramic detectors, maritime
  search lights and airport runway FOD detection. The product is physical hardware; Aerospace
  Kate publishes no API, SDK, developer portal or machine-readable contract of any kind.
